    <text x="40" y="66" fill="#4d7a12" font-size="15" font-weight="600" letter-spacing="2.2">IN PROGRESS · LEARNING</text>
    <text x="38" y="118" fill="#101412" font-size="46" font-weight="600" letter-spacing="-1.2">pipeline-dojo</text>
    <text x="40" y="164" fill="#4a554d" font-size="20">An interactive guide to data engineering: short</text><text x="40" y="192" fill="#4a554d" font-size="20">lessons, then SQL, Python and data modelling</text><text x="40" y="220" fill="#4a554d" font-size="20">exercises, checked right in the browser.</text>
