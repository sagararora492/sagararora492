<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="Fieldnotes: an agentic research assistant with checked citations">
  <title>Fieldnotes: an agentic research assistant with checked citations</title>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e3e9df" stroke-width="1"/></pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#f6f8f3"/><stop offset=".6" stop-color="#f6f8f3" stop-opacity=".93"/><stop offset="1" stop-color="#f6f8f3" stop-opacity=".2"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="638" height="318" rx="16" fill="#f6f8f3"/>
  <rect x="1" y="1" width="638" height="318" rx="16" fill="url(#grid)"/>
  <rect x="1" y="1" width="638" height="318" rx="16" fill="url(#fade)" stroke="#c9d3c4" stroke-width="2"/>
  
  <g transform="translate(520 40)">
    <rect x="0" y="0" width="64" height="80" rx="8" fill="#ffffff" stroke="#c9d3c4" stroke-width="2"/>
    <g stroke="#c9d3c4" stroke-width="3" stroke-linecap="round">
      <path d="M14 20H50"/><path d="M14 32H50"/><path d="M14 44H38"/>
    </g>
    <circle cx="56" cy="70" r="16" fill="#4d7a12"/>
    <path d="M48 70l6 6 10-11" fill="none" stroke="#f6f8f3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="66" fill="#4d7a12" font-size="15" font-weight="600" letter-spacing="2.2">FEATURED · AGENTIC AI</text>
    <text x="38" y="118" fill="#101412" font-size="46" font-weight="600" letter-spacing="-1.2">Fieldnotes</text>
    <text x="40" y="164" fill="#4a554d" font-size="20">A research assistant that plans, collects sources</text><text x="40" y="192" fill="#4a554d" font-size="20">and writes a brief where every citation is</text><text x="40" y="220" fill="#4a554d" font-size="20">checked against the stored source text.</text>
    <rect x="40" y="242" width="188" height="32" rx="16" fill="#ffffff" stroke="#c9d3c4"/><text x="134.0" y="263" text-anchor="middle" fill="#4a554d" font-size="15">Multi-model agents</text><rect x="238" y="242" width="162" height="32" rx="16" fill="#ffffff" stroke="#c9d3c4"/><text x="319.0" y="263" text-anchor="middle" fill="#4a554d" font-size="15">Citation checks</text><rect x="410" y="242" width="180" height="32" rx="16" fill="#ffffff" stroke="#c9d3c4"/><text x="500.0" y="263" text-anchor="middle" fill="#4a554d" font-size="15">Zero dependencies</text>
    <circle cx="46" cy="294" r="6" fill="#3572A5"/>
    <text x="60" y="299" fill="#4a554d" font-size="15">Python</text>
  </g>
</svg>
