<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="Slipway (planned): MLOps CI/CD with drift monitoring">
  <title>Slipway (planned): MLOps CI/CD with drift monitoring</title>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1f2722" stroke-width="1"/></pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#101412"/><stop offset=".6" stop-color="#101412" stop-opacity=".93"/><stop offset="1" stop-color="#101412" stop-opacity=".2"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="638" height="318" rx="16" fill="#101412"/>
  <rect x="1" y="1" width="638" height="318" rx="16" fill="url(#grid)"/>
  <rect x="1" y="1" width="638" height="318" rx="16" fill="url(#fade)" stroke="#354039" stroke-width="2"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <g transform="translate(520 40)">
    <path d="M44 8A36 36 0 0 1 80 44" fill="none" stroke="#354039" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M44 80A36 36 0 0 1 8 44" fill="none" stroke="#354039" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M73 37l7 9 7-9M1 51l7-9 7 9" fill="none" stroke="#c4f279" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="28" y="33" width="32" height="22" rx="5" fill="#191f1b" stroke="#c4f279" stroke-width="2"/><circle cx="44" cy="8" r="4" fill="#c4f279"/><circle cx="44" cy="80" r="4" fill="#c4f279"/>
  </g>
    <text x="40" y="66" fill="#c4f279" font-size="15" font-weight="600" letter-spacing="2.2">PLANNED · MLOPS</text>
    <text x="38" y="118" fill="#f1f4ed" font-size="46" font-weight="600" letter-spacing="-1.2">Slipway</text>
    <text x="40" y="164" fill="#b1bcb3" font-size="20">Gated CI/CD for ML models: tracked training,</text><text x="40" y="192" fill="#b1bcb3" font-size="20">a model registry, canary deploys, and drift</text><text x="40" y="220" fill="#b1bcb3" font-size="20">monitoring once models are live.</text>
    <rect x="40" y="242" width="82" height="32" rx="16" fill="#191f1b" stroke="#354039"/><text x="81.0" y="263" text-anchor="middle" fill="#b1bcb3" font-size="15">MLflow</text><rect x="132" y="242" width="131" height="32" rx="16" fill="#191f1b" stroke="#354039"/><text x="197.5" y="263" text-anchor="middle" fill="#b1bcb3" font-size="15">GitHub Actions</text><rect x="273" y="242" width="124" height="32" rx="16" fill="#191f1b" stroke="#354039"/><text x="335.0" y="263" text-anchor="middle" fill="#b1bcb3" font-size="15">Drift (PSI/KS)</text>
    <circle cx="46" cy="294" r="6" fill="#3572A5"/>
    <text x="60" y="299" fill="#b1bcb3" font-size="15">Python</text>
  </g>
</svg>
