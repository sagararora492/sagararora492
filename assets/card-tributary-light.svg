<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="Tributary (planned): change data capture and real-time stream processing">
  <title>Tributary (planned): change data capture and real-time stream processing</title>
  <defs>
