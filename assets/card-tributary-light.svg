      <stop offset="0" stop-color="#f6f8f3"/><stop offset=".6" stop-color="#f6f8f3" stop-opacity=".93"/><stop offset="1" stop-color="#f6f8f3" stop-opacity=".2"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="638" height="318" rx="16" fill="#f6f8f3"/>
  <rect x="1" y="1" width="638" height="318" rx="16" fill="url(#grid)"/>
  <rect x="1" y="1" width="638" height="318" rx="16" fill="url(#fade)" stroke="#c9d3c4" stroke-width="2"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <g transform="translate(520 40)">
    <path d="M0 10C40 10 40 44 70 44" fill="none" stroke="#c9d3c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 78C40 78 40 44 70 44" fill="none" stroke="#c9d3c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M70 44H96" fill="none" stroke="#c9d3c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="70" cy="44" r="6" fill="#4d7a12"/><rect x="-12" y="0" width="24" height="20" rx="5" fill="#ffffff" stroke="#4d7a12" stroke-width="2"/><rect x="-12" y="68" width="24" height="20" rx="5" fill="#ffffff" stroke="#4d7a12" stroke-width="2"/>
