<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" width="1280" height="430" role="img" aria-label="The platform, in build order: Tributary (CDC → Kafka → Flink →, Iceberg, Trino and dbt, in progress); Pantry (Offline from Iceberg, online via Go + Redis, planned); Slipway (Train, register, deploy;, monitor drift live, planned); Switchboard (Routing, rate limits, and observability, planned). Arrows: Tributary to Pantry (Iceberg), Pantry to Slipway (features), Slipway to Switchboard (models); Tributary also feeds Slipway (live CDC stream → drift monitoring) and Pantry serves Switchboard (online features).">
