<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="Switchboard (planned): a microservices and API gateway platform">
  <title>Switchboard (planned): a microservices and API gateway platform</title>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1f2722" stroke-width="1"/></pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#101412"/><stop offset=".6" stop-color="#101412" stop-opacity=".93"/><stop offset="1" stop-color="#101412" stop-opacity=".2"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="638" height="318" rx="16" fill="#101412"/>
  <rect x="1" y="1" width="638" height="318" rx="16" fill="url(#grid)"/>
  <rect x="1" y="1" width="638" height="318" rx="16" fill="url(#fade)" stroke="#354039" stroke-width="2"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <g transform="translate(520 40)">
    <path d="M16 44H40M40 44L68 8M40 44H68M40 44L68 80" fill="none" stroke="#354039" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-20" y="33" width="36" height="22" rx="5" fill="#191f1b" stroke="#c4f279" stroke-width="2"/><circle cx="40" cy="44" r="6" fill="#c4f279"/><rect x="64" y="-3" width="32" height="22" rx="5" fill="#191f1b" stroke="#c4f279" stroke-width="2"/><rect x="64" y="33" width="32" height="22" rx="5" fill="#191f1b" stroke="#c4f279" stroke-width="2"/><rect x="64" y="69" width="32" height="22" rx="5" fill="#191f1b" stroke="#c4f279" stroke-width="2"/>
  </g>
    <text x="40" y="66" fill="#c4f279" font-size="15" font-weight="600" letter-spacing="2.2">PLANNED · BACKEND</text>
    <text x="38" y="118" fill="#f1f4ed" font-size="46" font-weight="600" letter-spacing="-1.2">Switchboard</text>
    <text x="40" y="164" fill="#b1bcb3" font-size="20">Microservices behind one API gateway, with</text><text x="40" y="192" fill="#b1bcb3" font-size="20">auth, rate limiting, contract tests and</text><text x="40" y="220" fill="#b1bcb3" font-size="20">end-to-end tracing.</text>
    <rect x="40" y="242" width="85" height="32" rx="16" fill="#191f1b" stroke="#354039"/><text x="82.5" y="263" text-anchor="middle" fill="#b1bcb3" font-size="15">FastAPI</text><rect x="135" y="242" width="69" height="32" rx="16" fill="#191f1b" stroke="#354039"/><text x="169.5" y="263" text-anchor="middle" fill="#b1bcb3" font-size="15">Redis</text><rect x="214" y="242" width="133" height="32" rx="16" fill="#191f1b" stroke="#354039"/><text x="280.5" y="263" text-anchor="middle" fill="#b1bcb3" font-size="15">OpenTelemetry</text>
    <circle cx="46" cy="294" r="6" fill="#3572A5"/>
    <text x="60" y="299" fill="#b1bcb3" font-size="15">Python</text>
