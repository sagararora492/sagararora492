<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="Pantry (planned): a feature store for offline training and online serving">
  <title>Pantry (planned): a feature store for offline training and online serving</title>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e3e9df" stroke-width="1"/></pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#f6f8f3"/><stop offset=".6" stop-color="#f6f8f3" stop-opacity=".93"/><stop offset="1" stop-color="#f6f8f3" stop-opacity=".2"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="638" height="318" rx="16" fill="#f6f8f3"/>
  <rect x="1" y="1" width="638" height="318" rx="16" fill="url(#grid)"/>
  <rect x="1" y="1" width="638" height="318" rx="16" fill="url(#fade)" stroke="#c9d3c4" stroke-width="2"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <g transform="translate(520 40)">
    <rect x="0" y="6" width="36" height="22" rx="5" fill="#ffffff" stroke="#4d7a12" stroke-width="2"/><rect x="44" y="6" width="36" height="22" rx="5" fill="#ffffff" stroke="#4d7a12" stroke-width="2"/><rect x="0" y="36" width="36" height="22" rx="5" fill="#ffffff" stroke="#4d7a12" stroke-width="2"/><rect x="0" y="66" width="36" height="22" rx="5" fill="#ffffff" stroke="#4d7a12" stroke-width="2"/><rect x="44" y="66" width="36" height="22" rx="5" fill="#ffffff" stroke="#4d7a12" stroke-width="2"/><rect x="44" y="36" width="36" height="22" rx="5" fill="#4d7a12"/>
  </g>
    <text x="40" y="66" fill="#4d7a12" font-size="15" font-weight="600" letter-spacing="2.2">PLANNED · MLOPS</text>
    <text x="38" y="118" fill="#101412" font-size="46" font-weight="600" letter-spacing="-1.2">Pantry</text>
    <text x="40" y="164" fill="#4a554d" font-size="20">A feature store: define a feature once, serve</text><text x="40" y="192" fill="#4a554d" font-size="20">it offline for point-in-time training sets</text><text x="40" y="220" fill="#4a554d" font-size="20">and online for low-latency inference.</text>
    <rect x="40" y="242" width="162" height="32" rx="16" fill="#ffffff" stroke="#c9d3c4"/><text x="121.0" y="263" text-anchor="middle" fill="#4a554d" font-size="15">Point-in-time joins</text><rect x="212" y="242" width="69" height="32" rx="16" fill="#ffffff" stroke="#c9d3c4"/><text x="246.5" y="263" text-anchor="middle" fill="#4a554d" font-size="15">Redis</text><rect x="291" y="242" width="85" height="32" rx="16" fill="#ffffff" stroke="#c9d3c4"/><text x="333.5" y="263" text-anchor="middle" fill="#4a554d" font-size="15">FastAPI</text>
    <circle cx="46" cy="294" r="6" fill="#3572A5"/>
    <text x="60" y="299" fill="#4a554d" font-size="15">Python</text>
  </g>
