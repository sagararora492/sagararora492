    <text x="40" y="164" fill="#b1bcb3" font-size="20">A Data Vault 2.0 warehouse in dbt: hubs, links</text><text x="40" y="192" fill="#b1bcb3" font-size="20">and satellites with full history, plus a</text><text x="40" y="220" fill="#b1bcb3" font-size="20">business vault and marts for analytics.</text>
