  </g>
    <text x="40" y="66" fill="#4d7a12" font-size="15" font-weight="600" letter-spacing="2.2">PLANNED · DATA QUALITY</text>
    <text x="38" y="118" fill="#101412" font-size="46" font-weight="600" letter-spacing="-1.2">Assay</text>
    <text x="40" y="164" fill="#4a554d" font-size="20">Declarative data quality checks that catch bad</text><text x="40" y="192" fill="#4a554d" font-size="20">data before it lands, with readable reports</text><text x="40" y="220" fill="#4a554d" font-size="20">and row-level quarantine.</text>
