<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="Assay (planned): a declarative data quality framework">
  <title>Assay (planned): a declarative data quality framework</title>
  <defs>
